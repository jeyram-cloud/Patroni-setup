#!/usr/bin/env bash
# ----------------------------------------------------------
# cluster.conf — single source of truth for IPs, hostnames
#                and ports used by every script in this repo.
#
# To move the cluster to a different subnet, edit ONLY this
# file. All scripts source it and read:
#   DB_NODES, LB_VMS, ETCD_NODES
#   NODE_IP_<shortname>     e.g. NODE_IP_postnode1
#   NODE_HOST_<shortname>   e.g. NODE_HOST_haproxy1 (= pghaproxy1)
#   VIP_WRITE, VIP_READ
#   VIP_SUBNET, VIP_CIDR_LEN, KEEPALIVED_AUTH
#   DB_SUBNET               derived /24 for the postgres nodes
#   ETCD_ENDPOINTS          "host:port,host:port,host:port"
#   PATRONI_NODES           list of "host:port" for HAProxy backends
#
# NOTE: bash 3.2 (macOS default) has no associative arrays.
# We pre-expand every key as NODE_IP_<name> / NODE_HOST_<name>
# at sourcing time so downstream scripts can do plain $NODE_IP_postnode1.
# ----------------------------------------------------------

# ---------- DB nodes (Postgres + Patroni) ----------
DB_NODES=(patnode1 patnode2 patnode3 patnode4 patnode5 patnode6)

# postnode1 is always the initial leader candidate.
# Each line: <shortname> <ip>
NODE_IP_patnode1="192.168.72.170"
NODE_IP_patnode2="192.168.72.171"
NODE_IP_patnode3="192.168.72.172"
NODE_IP_patnode4="192.168.72.173"
NODE_IP_patnode5="192.168.72.174"
NODE_IP_patnode6="192.168.72.175"

# ---------- etcd cluster (subset of DB_NODES) ----------
ETCD_NODES=(patnode1 patnode2 patnode3)

# ---------- HAProxy / Keepalived nodes ----------
LB_VMS=(pathaproxy1 pathaproxy2)

# Note: pathaproxy1/2 are Vagrant VM names; their in-guest hostnames are
# pathaproxy1/pathaproxy2. These are the names written to /etc/hosts.
NODE_IP_pathaproxy1="192.168.10.160"
NODE_HOST_pathaproxy1="pathaproxy1"
NODE_IP_pathaproxy2="192.168.10.131"
NODE_HOST_pathaproxy2="pathaproxy2"

# ---------- VIP / shared subnet ----------
VIP_WRITE="192.168.90.150"   # write endpoint (HAProxy -> Patroni leader)
VIP_READ="192.168.90.150"    # read endpoint  (HAProxy -> replicas, same VIP)
VIP_PORT_WRITE="6000"
VIP_PORT_READ="6001"
VIP_SUBNET_CIDR="192.168.90.0/24"   # for HAProxy backends + keepalived unicast
VIP_CIDR_LEN="24"                   # mask length applied to VIP_WRITE in keepalived.conf
KEEPALIVED_AUTH="patcluster"          # VRRP shared password
KEEPALIVED_ROUTER_ID="91"            # VRID (must match between peers)
KEEPALIVED_PRIORITY_MASTER="310"
KEEPALIVED_PRIORITY_BACKUP="300"

# ---------- Subnet helpers ----------
# /24 subnet the DB nodes live on. Used by pg_hba.conf `host ... <subnet> md5`
# and by the Vagrantfile for `private_network` ranges.
DB_SUBNET="192.168.72.0/16"

# ---------- Derived helpers (do not edit by hand) ----------
# Comma-separated lists used by Patroni / etcd / HAProxy.
# bash 3.2 (macOS default) has no associative arrays — use ${!var} indirection
# guarded with `:-` so that 'set -u' doesn't trip when a key is absent.
_ip_of() { eval "echo \"\${NODE_IP_${1}:-}\""; }
_host_of() { eval "echo \"\${NODE_HOST_${1}:-}\""; }

_etcd_eps=""
for _n in "${ETCD_NODES[@]}"; do
  _ip="$(_ip_of "$_n")"
  _etcd_eps="${_etcd_eps}${_ip}:2379,"
done
ETCD_ENDPOINTS="${_etcd_eps%,}"

_patroni_lines=""
for _n in "${DB_NODES[@]}"; do
  _ip="$(_ip_of "$_n")"
  _patroni_lines="${_patroni_lines}    server ${_n} ${_ip}:5432 maxconn 300 check port 8008
"
done
PATRONI_BACKENDS="$(printf '%s' "${_patroni_lines}")"

# Hosts file entries (one per line). Generated from NODE_IP_* + NODE_HOST_*.
_hosts_entries=""
for _n in "${DB_NODES[@]}" "${LB_VMS[@]}"; do
  _ip="$(_ip_of "$_n")"
  _host="$(_host_of "$_n")"
  if [ -n "$_host" ] && [ "$_host" != "$_n" ]; then
    _hosts_entries="${_hosts_entries}${_ip} ${_n} ${_host}
"
  else
    _hosts_entries="${_hosts_entries}${_ip} ${_n}
"
  fi
done
HOSTS_ENTRIES="${_hosts_entries}"

# ---------- Common Patroni / Postgres credentials ----------
PG_SUPERUSER="postgres"
PG_SUPERUSER_PASSWORD="Postgres@123"
PG_REPL_USER="replicator"
PG_REPL_PASSWORD="Replicator@123"
PG_ADMIN_USER="admin"
PG_ADMIN_PASSWORD="Admin@123"
PG_DATABASE="postgres"
PG_LISTEN_PORT="5432"

HAPROXY_STATS_USER="admin"
HAPROXY_STATS_PASSWORD="admin@123"

ETCD_CLUSTER_TOKEN="pgvm-etcd-cluster-token"
PATRONI_SCOPE="pat-cluster"
PATRONI_NAMESPACE="/service/"
